<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP-32D</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>ESP-32D</h1>
      <p>静的サイト</p>

      <hr />

      <h2>デバイス状態</h2>
      <table>
        <tbody>
          <tr><th>状態</th><td id="health-badge">確認中</td></tr>
          <tr><th>ホスト名</th><td id="hostname">—</td></tr>
          <tr><th>IPアドレス</th><td id="ip">—</td></tr>
          <tr><th>稼働時間</th><td id="uptime">—</td></tr>
          <tr><th>更新日時</th><td id="updated">—</td></tr>
        </tbody>
      </table>
      <p id="health-message">デバイスの状態を取得しています。</p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
